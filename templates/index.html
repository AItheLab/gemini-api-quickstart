<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Chat</title>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="bg-gray-50 h-screen overflow-hidden">
    <div id="app" class="h-full flex">
        <!-- Left Sidebar -->
        <div class="w-1/4 bg-white border-r border-gray-200 flex flex-col h-full">
            <div class="p-4 border-b border-gray-200">
                <div class="flex items-center">
                    <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="Gemini Logo" class="h-8 mr-2">
                    <h1 class="text-xl font-bold">Gemini Chat</h1>
                </div>
            </div>
            
            <!-- New Chat Button -->
            <div class="p-4">
                <button @click="startNewChat" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-full flex items-center justify-center">
                    <i class="fas fa-plus mr-2"></i> New Chat
                </button>
            </div>
            
            <!-- Chat History -->
            <div class="flex-1 overflow-y-auto p-2">
                <div class="text-xs uppercase text-gray-500 font-semibold px-2 mb-2">Recent Chats</div>
                <div 
                    v-for="(chat, index) in chatHistory" 
                    :key="index" 
                    @click="selectChat(index)" 
                    class="p-2 rounded-lg hover:bg-gray-100 cursor-pointer mb-1 flex items-center"
                    :class="{'bg-blue-50': selectedChatIndex === index}"
                >
                    <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center mr-2">
                        <i class="fas fa-message text-blue-500"></i>
                    </div>
                    <div class="truncate">{{ chat.title || 'New conversation' }}</div>
                </div>
            </div>
            
            <!-- User Info -->
            <div class="p-4 border-t border-gray-200">
                <div class="flex items-center">
                    <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white mr-2">
                        <i class="fas fa-user"></i>
                    </div>
                    <div>User</div>
                </div>
            </div>
        </div>
        
        <!-- Main Chat Area -->
        <div class="flex-1 flex flex-col h-full relative">
            <!-- Chat Header -->
            <div class="p-4 border-b border-gray-200 flex items-center justify-between bg-white">
                <div class="font-semibold">Gemini-2.0-Flash</div>
                <div class="flex items-center">
                    <button class="p-2 rounded-full hover:bg-gray-100">
                        <i class="fas fa-ellipsis-v text-gray-500"></i>
                    </button>
                </div>
            </div>
            
            <!-- Messages Area -->
            <div class="flex-1 overflow-y-auto p-4" ref="messagesContainer">
                <div v-if="messages.length === 0" class="h-full flex items-center justify-center text-gray-400 flex-col">
                    <div class="text-6xl mb-4"><i class="fas fa-robot"></i></div>
                    <div class="text-xl">Start a conversation with Gemini AI</div>
                    <div class="mt-2 text-sm">You can also upload images for multimodal queries</div>
                </div>
                
                <template v-else>
                    <div v-for="(message, index) in messages" :key="index" class="mb-6">
                        <!-- Message Role -->
                        <div :class="{'text-right': message.role === 'user'}" class="mb-1 text-xs font-semibold text-gray-500">
                            {{ message.role === 'user' ? 'You' : 'Gemini' }}
                        </div>
                        
                        <!-- Message Content -->
                        <div 
                            :class="{
                                'bg-blue-500 text-white ml-auto': message.role === 'user',
                                'bg-gray-100 text-gray-800': message.role !== 'user'
                            }"
                            class="rounded-lg p-3 max-w-[80%] inline-block whitespace-pre-wrap"
                            style="width: fit-content"
                        >
                            {{ message.content }}
                        </div>
                    </div>
                    
                    <!-- Typing Indicator -->
                    <div v-if="isLoading" class="flex items-center mb-6">
                        <div class="text-xs font-semibold text-gray-500 mb-1">Gemini</div>
                        <div class="bg-gray-100 text-gray-800 rounded-lg p-3 inline-block">
                            <div class="typing-indicator">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
            
            <!-- File Upload Preview -->
            <div v-if="selectedFile" class="px-4 py-2 border-t border-gray-200 bg-blue-50">
                <div class="flex items-center">
                    <div class="w-10 h-10 bg-blue-100 rounded flex items-center justify-center mr-2">
                        <i class="fas fa-image text-blue-500"></i>
                    </div>
                    <div class="flex-1">
                        <div class="text-sm font-semibold truncate">{{ selectedFile.name }}</div>
                        <div class="text-xs text-gray-500">Image will be included in your next message</div>
                    </div>
                    <button @click="removeFile" class="text-red-500 hover:text-red-700">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            
            <!-- Message Input -->
            <div class="p-4 border-t border-gray-200 bg-white">
                <div class="flex items-end">
                    <!-- File Upload Button -->
                    <button @click="triggerFileUpload" class="p-2 text-gray-500 hover:text-blue-500 rounded-full hover:bg-gray-100 mr-2">
                        <i class="fas fa-paperclip"></i>
                    </button>
                    <input type="file" ref="fileInput" @change="handleFileUpload" accept="image/*" class="hidden">
                    
                    <!-- Text Input -->
                    <div class="flex-1 border border-gray-300 rounded-lg bg-white">
                        <textarea 
                            v-model="userMessage" 
                            @keydown.enter.prevent="sendMessage"
                            placeholder="Message Gemini..." 
                            class="w-full p-3 rounded-lg resize-none focus:outline-none"
                            rows="1"
                            ref="messageInput"
                        ></textarea>
                    </div>
                    
                    <!-- Send Button -->
                    <button 
                        @click="sendMessage" 
                        :disabled="!userMessage.trim() && !selectedFile"
                        :class="{'bg-blue-500 hover:bg-blue-600': userMessage.trim() || selectedFile, 'bg-gray-300': !userMessage.trim() && !selectedFile}"
                        class="ml-2 p-2 rounded-full text-white w-10 h-10 flex items-center justify-center"
                    >
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div 
        v-if="notification.show" 
        class="fixed top-4 right-4 bg-gray-800 text-white py-2 px-4 rounded-lg shadow-lg transition-opacity duration-300"
        :class="{'opacity-100': notification.show, 'opacity-0': !notification.show}"
    >
        {{ notification.message }}
    </div>

    <!-- Vue App Script -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
